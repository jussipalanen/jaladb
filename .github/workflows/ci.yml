name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        # Same major version as docker-compose.yml.
        image: postgres:18
        env:
          POSTGRES_USER: jaladb
          POSTGRES_PASSWORD: jaladb_ci
          POSTGRES_DB: jaladb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jaladb -d jaladb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://jaladb:jaladb_ci@localhost:5432/jaladb

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Apply migrations to an empty database
        run: npm run db:migrate

      - name: Re-running migrations is a no-op
        run: npm run db:migrate | grep -q "Database is up to date."

      - name: Load seed data
        run: npm run db:seed

      - name: Integration tests
        run: npm test

  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jaladb
          POSTGRES_PASSWORD: jaladb_ci
          POSTGRES_DB: jaladb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jaladb -d jaladb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://jaladb:jaladb_ci@localhost:5432/jaladb

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # The API tests migrate and seed their database with the tooling in the
      # repository root, so both packages are installed.
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend

      - name: Type check
        run: npm run typecheck --prefix backend

      - name: API integration tests
        run: npm test --prefix backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Component tests
        run: npm test

      - name: Production build
        run: npm run build

  docker:
    name: Docker stack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Build and start the full stack
        run: docker compose --profile app up -d --build --wait

      - name: Load seed data through the migrate image
        run: docker compose --profile app run --rm migrate seed

      - name: Check the API and the console (and its /api proxy)
        run: |
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS http://127.0.0.1:8081/ > /dev/null
          curl -fsS http://127.0.0.1:8081/api/customers/1/orders | grep -q '"orderId":14'

      - name: Show logs on failure
        if: failure()
        run: docker compose --profile app logs

      - name: Stop
        if: always()
        run: docker compose --profile app down -v

  tooling:
    name: Tooling checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Lint dev helper script
        run: shellcheck --shell=bash dev

      - name: Validate docker-compose.yml
        run: |
          docker compose config --quiet
          docker compose --profile app config --quiet
