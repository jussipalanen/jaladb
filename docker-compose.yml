services:
  postgres:
    image: postgres:18
    container_name: jaladb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jaladb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jaladb_local}
      POSTGRES_DB: ${POSTGRES_DB:-jaladb}
      TZ: UTC
    ports:
      # Bound to localhost only: this is a development database.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep versioned data directories under /var/lib/postgresql.
      - jaladb-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Web GUI for browsing the database: http://localhost:8080
  # Log in with System "PostgreSQL", Server "postgres" and the credentials from .env.
  adminer:
    image: adminer:5
    container_name: jaladb-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Full stack (profile "app") ---------------------------------------
  # Started with `./dev up-all` or `docker compose --profile app up -d --build`.
  # Without the profile, only PostgreSQL and Adminer start, for local
  # development with `./dev api` and `./dev ui`.

  # One-shot: applies migrations, then exits. The API waits for it.
  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: database/Dockerfile
    image: jaladb-migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-jaladb}:${POSTGRES_PASSWORD:-jaladb_local}@postgres:5432/${POSTGRES_DB:-jaladb}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # API: http://localhost:3000
  api:
    profiles: [app]
    build: ./backend
    image: jaladb-api
    container_name: jaladb-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-jaladb}:${POSTGRES_PASSWORD:-jaladb_local}@postgres:5432/${POSTGRES_DB:-jaladb}
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Demo console: http://localhost:8081
  console:
    profiles: [app]
    build: ./frontend
    image: jaladb-console
    container_name: jaladb-console
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  jaladb-data:
